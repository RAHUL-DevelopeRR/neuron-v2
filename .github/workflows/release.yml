name: Release NeuronCLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --omit=optional

      - name: Check npm launcher
        run: node --check bin/cli.js

      - name: Check React TUI types
        run: npm run check

      - name: Run Go tests
        run: go test ./...
        working-directory: go

      - name: Run Python packaging check
        run: python -m pip install build twine && python -m build --outdir dist/pypi

  package:
    name: package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packaging tools
        run: |
          python -m pip install build twine
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/package-all.ps1 -SkipTests -Clean

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: neuroncli-release-${{ github.ref_name }}
          path: |
            dist/release/**
            dist/npm/*.tgz
            dist/pypi/**
            packaging/homebrew/neuroncli.rb

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*
            dist/npm/*.tgz
            dist/pypi/*
            packaging/homebrew/neuroncli.rb
          fail_on_unmatched_files: true

  publish-npm:
    name: publish npm
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neuroncli-release-${{ github.ref_name }}
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish npm tarballs
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in artifacts/dist/npm/zero-x-neuron-*-*.tgz; do
            [ -f "$pkg" ] || continue
            npm publish "$pkg" --access public
          done
          for pkg in artifacts/dist/npm/zero-x-neuron-[0-9]*.tgz; do
            [ -f "$pkg" ] || continue
            npm publish "$pkg" --access public
          done
      - name: Skip npm publish
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN is not configured; skipping npm publish."

  publish-pypi:
    name: publish pypi
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neuroncli-release-${{ github.ref_name }}
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Publish PyPI distributions
        if: env.PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_API_TOKEN }}
        run: |
          python -m pip install twine
          python -m twine upload artifacts/dist/pypi/*
      - name: Skip PyPI publish
        if: env.PYPI_API_TOKEN == ''
        run: echo "PYPI_API_TOKEN is not configured; skipping PyPI publish."
