name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            bin: neuron
            artifact_name: neuron-linux-x64
          - name: macos-arm64
            os: macos-14
            bin: neuron
            artifact_name: neuron-macos-arm64
          - name: windows-x64
            os: windows-latest
            bin: neuron.exe
            artifact_name: neuron-windows-x64.exe
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: dtolnay/rust-toolchain@stable

      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c 'import json,os,subprocess; packages=json.loads(subprocess.check_output(["cargo","metadata","--no-deps","--format-version","1"]))["packages"]; version=next(p["version"] for p in packages if p["name"]=="rusty-claude-cli"); assert "v"+version == os.environ["GITHUB_REF_NAME"]'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Build release binary
        run: cargo build --release -p rusty-claude-cli

      - name: Check release executable
        shell: bash
        run: '"target/release/${{ matrix.bin }}" --version'

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.artifact_name }}"
          chmod +x "dist/${{ matrix.artifact_name }}"
          python -c "import hashlib,pathlib; p=pathlib.Path('dist/${{ matrix.artifact_name }}'); p.with_name(p.name+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: rust/dist/*

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rust/dist/*
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish npm package
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@^11.5.1
      - name: Check release version
        working-directory: npm/neuroncli
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - name: Publish public package
        working-directory: npm/neuroncli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish PyPI package
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.ENABLE_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neuroncli
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check release version
        run: python -c "import os,tomllib,pathlib; version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert 'v'+version == os.environ['GITHUB_REF_NAME']"
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
