[package]
name = "rusty-claude-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "neuron"
path = "src/main.rs"

[dependencies]
api = { path = "../api" }
commands = { path = "../commands" }
compat-harness = { path = "../compat-harness" }
crossterm = "0.28"
pulldown-cmark = "0.13"
rustyline = "15"
runtime = { path = "../runtime" }
plugins = { path = "../plugins" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
syntect = "5"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time", "net"] }
tools = { path = "../tools" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
webbrowser = "1.0"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
zeroize = { version = "1.7", features = ["derive"] }
constant_time_eq = "0.3"
hex = "0.4"
dirs = "6"

# OS credential stores only on platforms whose native backend needs no extra
# system libraries. Linux (and anything else) uses the 0600 credentials file,
# so CI builds there never pull in D-Bus/secret-service.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }

# The account's home from directory services (getpwuid_r), so a run with an
# overridden HOME never touches the real login Keychain item.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.29", default-features = false, features = ["user"] }

[lints]
workspace = true

[dev-dependencies]
mock-anthropic-service = { path = "../mock-anthropic-service" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

