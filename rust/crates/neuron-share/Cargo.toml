[package]
name = "neuron-share"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shares a Neuron session with the phone app through the Zero-X relay (neuron-relay/1)"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hkdf = "0.12"
hmac = "0.12"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[lints]
workspace = true
