[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroncli"
version = "6.3.0"
description = "NeuronCLI - AI-powered terminal assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "RAHUL-DevelopeRR"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development",
]

[project.scripts]
neuron = "neuron_cli:main"

[project.urls]
Homepage = "https://github.com/RAHUL-DevelopeRR/neuron-v2"
Repository = "https://github.com/RAHUL-DevelopeRR/neuron-v2"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuron_cli*"]

[tool.setuptools.package-data]
neuron_cli = ["bin/*"]
